  # --------------------------------------------------------------------
  # Tier 3: Major venues with no known JSON/ICS feed - headless-browser
  # scraping with CSS selectors. SELECTORS ARE BEST-GUESS PLACEHOLDERS
  # (sandbox has no internet access to verify). When this source shows
  # `no_results` or `parse_error`, inspect the live page and fix the
  # `config.*_selector` values below.
  # --------------------------------------------------------------------
  - slug: dr-phillips-center
    name: "Dr. Phillips Center for the Performing Arts"
    source_type: html
    scraper: playwright_html
    base_url: "https://www.drphillipscenter.org"
    homepage_url: "https://www.drphillipscenter.org/calendar"
    default_category: theater
    config:
      list_url: "https://www.drphillipscenter.org/calendar"
      item_selector: ".eventCard"
      title_selector: ".title, h3"
      date_selector: ".top-date .start"
      link_selector: "a.desc"
      image_selector: "img"
      venue_name: "Dr. Phillips Center for the Performing Arts"
      city: "Orlando"
      latitude: 28.5398
      longitude: -81.3756
      wait_ms: 3000


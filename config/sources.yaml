# ============================================================================
# Source registry for the Central Florida events aggregator.
#
# Each entry is synced into the `sources` table on every run
# (scraper/db.py:sync_sources) and dispatched to the matching class in
# scraper/sources/SCRAPER_REGISTRY based on `scraper:`.
#
# Adding a new source usually does NOT require new code:
#   - `scraper: tribe_events` works for any site running the WordPress
#     "The Events Calendar" plugin - just set `base_url`.
#   - `scraper: ics_calendar` works for any public .ics feed - set
#     `config.ics_url`.
#   - `scraper: playwright_html` works for any site via CSS selectors -
#     set `config.list_url` + `config.item_selector` etc.
#   - `scraper: ticketmaster` is a single corridor-wide source (see
#     config/geo.yaml for search centers); no per-venue entries needed.
#   - `scraper: facebook_events` is selective/best-effort - see
#     scraper/sources/facebook_events.py.
#
# `is_active: false` sources are skipped entirely (not even synced... -
# actually they ARE synced to `sources` for bookkeeping, just not run).
#
# `allow_empty: true` suppresses the "0 events" diagnostic for sources
# that may legitimately have nothing upcoming sometimes.
#
# IMPORTANT: This sandbox has no outbound network access, so none of
# these have been live-verified. Run `python -m scraper.main` once
# (e.g. via the GitHub Action, which does have network access) and
# check the "ACTION NEEDED" section of its output - it tells you
# exactly which sources need a different `scraper` type or updated
# selectors/URLs.
# ============================================================================

sources:
  # --------------------------------------------------------------------
  # Tier 1: Aggregator API - covers most arenas/amphitheaters/clubs
  # across the whole corridor (Kia Center, Addition Financial Arena,
  # Daytona International Speedway, House of Blues Orlando, The
  # Beacham, Hard Rock Live, etc.) via geo-radius search.
  # --------------------------------------------------------------------
  - slug: ticketmaster-central-florida
    name: "Ticketmaster - Central Florida Corridor"
    source_type: api
    scraper: ticketmaster
    homepage_url: "https://www.ticketmaster.com"
    default_category: music
    is_active: true
    notes: >
      Requires TICKETMASTER_API_KEY (free, https://developer.ticketmaster.com/).
      Searches the radii defined in config/geo.yaml search_centers, covering
      Orlando metro + Daytona/St. Augustine. Already covers Ticketmaster/Live
      Nation-ticketed venues, so dedicated scrapers below focus on
      independent venues, theaters, museums, and family/festival sources.


  - slug: eventbrite-central-florida
    name: "Eventbrite - Central Florida (Community/Family/Holiday)"
    source_type: api
    scraper: eventbrite
    homepage_url: "https://www.eventbrite.com"
    default_category: community
    is_active: false  # needs EVENTBRITE_API_KEY secret -- free at developer.eventbrite.com
    allow_empty: true
    notes: >
      Requires EVENTBRITE_API_KEY (free, https://developer.eventbrite.com/).
      Covers community events, family festivals, holiday/4th of July fireworks
      shows, free civic events -- the gap not covered by Ticketmaster.
      Get key, then add as GitHub secret EVENTBRITE_API_KEY and set is_active: true.


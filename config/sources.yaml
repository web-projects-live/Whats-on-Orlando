  # --------------------------------------------------------------------
  # Known gaps / future work (documented, not yet implemented):
  #
  #  - Universal Orlando seasonal/special events (Halloween Horror
  #    Nights, Mardi Gras, Star Wars-type tie-ins): the events pages are
  #    Next.js SPAs that hydrate from a __NEXT_DATA__ JSON blob rather
  #    than static HTML, so they need a small bespoke scraper that
  #    extracts that JSON via Playwright rather than CSS selectors.
  #
  #  - Resident Advisor (ra.co) for EDM/rave listings: ra.co/graphql is
  #    queryable without an API key but has active bot-detection
  #    (Cloudflare). Worth a dedicated `ra_co` scraper later with
  #    careful rate limiting + realistic headers.
  #
  #  - AXS-only venues (no public API; would need headless scraping of
  #    axs.com venue pages or a paid scraper API).
  #
  #  - Eventbrite (organizer/category feeds for Orlando: master, this
  #    week, live music, EDM, arts, kids/free), SeatGeek, CheapTickets,
  #    StayHappening, AllEvents.in, EDMTrain, JamBase, Bandsintown,
  #    Shazam event feeds, Trip.com, Tix4Cause, TicketSqueeze: none of
  #    these expose a stable, key-free public API for arbitrary metro
  #    searches. Eventbrite's public search API was deprecated; the
  #    others either require paid/partner API access or change their
  #    HTML/JSON shape often enough that a scraper would need constant
  #    maintenance. Revisit if/when a maintained `playwright_html`
  #    config proves stable for one of these.
  #
  #  - Tourism-board / city / .gov calendars that are NOT WordPress
  #    (Visit Orlando, Visit Florida, Orlando Date Night Guide,
  #    Orlando Meeting, Experience Kissimmee, Visit St. Augustine,
  #    Daytona Beach CVB / daytonabeach.com / daytona.events, City of
  #    Sanford, Downtown Sanford Main Street, City of Kissimmee
  #    (kissimmee.gov), Patch.com hyperlocal calendars (Orlando,
  #    Sanford, etc.), Orlando Magazine arts season guide, Orlando
  #    Theatre Review's theater directory, Gotta Go Orlando, Diocese of
  #    St. Augustine): these mostly run Simpleview/CivicPlus/proprietary
  #    CMSes with no REST API. Best path is `playwright_html` per site
  #    once a real run identifies stable selectors - add entries here
  #    one at a time as they're verified rather than guessing selectors
  #    for a dozen sites at once.
  #
  #  - Comic/fandom convention aggregators (Comic-Cons.xyz,
  #    Comiconomicon, Con Calendar): small low-traffic directory sites,
  #    good `playwright_html` candidates but unverified - add once a
  #    selector set is confirmed against the live page.
  #
  #  - Social-media-first discovery (Bungalower Instagram, Arts in
  #    Orlando Instagram, "related accounts" graph traversal to find
  #    more venue pages): Instagram has no practical public API for
  #    this and aggressive bot detection. Out of scope; the
  #    `facebook_events` scraper below covers the FB side for venues
  #    with confirmed page slugs.
  # --------------------------------------------------------------------

